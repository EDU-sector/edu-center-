services:
  - type: web
    name: edutricity
    runtime: php
    plan: free
    buildCommand: ""
    startCommand: "php -S 0.0.0.0:$PORT -t public"
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: edutricity-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: edutricity-db
          property: port
      - key: DB_NAME
        value: edutricity
      - key: DB_USER
        fromDatabase:
          name: edutricity-db
          property: user
      - key: DB_PASS
        fromDatabase:
          name: edutricity-db
          property: password
      - key: DB_CHARSET
        value: utf8mb4

databases:
  - name: edutricity-db
    databaseName: edutricity
    user: edutricity
